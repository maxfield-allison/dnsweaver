name: CI

# Pull-request validation for the public repository.
# GitHub Actions minutes are free for public repositories, so contributor PRs
# get fast lint/test/build feedback here. Heavy release engineering
# (multi-arch images, signing, deploy) runs on GitLab after merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: |
          # Install golangci-lint from source so it is compiled with the same
          # Go toolchain as the module's go directive (go.mod). The prebuilt
          # binaries shipped by golangci-lint-action are built with an older Go
          # and refuse to run against a newer target version. Mirrors the
          # GitLab lint job, which installs golangci-lint the same way.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run --config .golangci.yml --timeout 5m

  release-tests:
    name: Release failure fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p test_release.py -v

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: Build container image
        run: docker build --build-arg VERSION=ci -t dnsweaver:healthcheck-test .
      - name: Test container healthcheck
        run: ./scripts/test-image-healthcheck.sh dnsweaver:healthcheck-test

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          ./scripts/govulncheck-gate.sh
      - name: Retain govulncheck evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: govulncheck-evidence
          path: .artifacts/govulncheck
          if-no-files-found: error
