name: Product website
on:
  push:
    branches: [main]
    paths: ["website/**", "website-tests/**", "scripts/build_website.py", "scripts/check_website.py", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "website-tests/**", "scripts/build_website.py", "scripts/check_website.py", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
      - name: Build and check rendered pages
        run: |
          python scripts/build_website.py
          python scripts/check_website.py
      - name: Exercise desktop, mobile, motion and fallback journeys
        working-directory: website-tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: website-browser-evidence
          path: website-tests/test-results
          retention-days: 7
