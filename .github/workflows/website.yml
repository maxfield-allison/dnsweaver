name: Product website
on:
  push:
    branches: [main]
    paths: ["website/**", "website-tests/**", "scripts/build_website.py", "scripts/check_website.py", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "website-tests/**", "scripts/build_website.py", "scripts/check_website.py", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Build and check rendered pages
        run: |
          python scripts/build_website.py
          python scripts/check_website.py
      - name: Exercise desktop, mobile, motion and fallback journeys
        working-directory: website-tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: website-browser-evidence
          path: website-tests/test-results
          retention-days: 7
