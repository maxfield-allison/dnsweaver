# dnsweaver - GitLab CI/CD Pipeline
# Streamlined from go-project-template

stages: [validate, test, security, build, pages, docker, qualify, assemble, release]

variables:
  GOPROXY: https://proxy.golang.org,direct
  GOFLAGS: "-mod=readonly -p=2"
  GOMAXPROCS: "2"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"
  BINARY_NAME: "dnsweaver"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|fix)\//
    - if: $CI_COMMIT_TAG

# Rule templates
.rules-code-changes: &rules-code-changes
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == "main"
    changes: &code-files ["{**/*.go,go.mod,go.sum,.golangci.yml,.gitlab-ci.yml,.github/workflows/*.yml,scripts/govulncheck-gate.sh,scripts/test-govulncheck-gate.sh,security/govulncheck-exceptions.json,scripts/ci-lint.sh,scripts/release.py,scripts/test_release.py,ci/release-inputs.json,.gitleaks.toml,Dockerfile,.dockerignore,docker/entrypoint.sh,scripts/test-image-healthcheck.sh,testdata/image-healthcheck-config.yml,.trivyignore}"]
  - if: $CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|fix)\//
    changes: *code-files
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *code-files

# Docker builds: main, tags, merge requests, and feature branches.
# Every candidate is qualified by digest before any mutable tag is advanced.
.rules-docker: &rules-docker
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == "main"
    changes: &docker-files ["{**/*.go,go.mod,go.sum,Dockerfile,.dockerignore,.gitlab-ci.yml,docker/entrypoint.sh,scripts/test-image-healthcheck.sh,testdata/image-healthcheck-config.yml,scripts/release.py,scripts/test_release.py,ci/release-inputs.json,.trivyignore}"]
  - if: $CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|fix)\//
    changes: *docker-files
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *docker-files

.go-base:
  image: golang:1.26.8-alpine3.24
  cache:
    key:
      prefix: "go-1.26.8"
      files: [go.sum]
    paths: [.cache/go/pkg/mod, .cache/go/bin, .cache/go-build, .cache/golangci-lint]
  before_script:
    - export PATH="$GOPATH/bin:$PATH"
    - apk add --no-cache git
    - go mod download

# ─────────────────────────────────────────────────────────────────────────────
# Validate
# ─────────────────────────────────────────────────────────────────────────────

validate:branch-name:
  stage: validate
  image: alpine:3.21
  script:
    - |
      [ "$CI_COMMIT_BRANCH" = "main" ] && exit 0
      [ -n "$CI_COMMIT_TAG" ] && exit 0
      echo "$CI_COMMIT_REF_NAME" | grep -qE "^(feature|bugfix|hotfix|fix)/[0-9]+-" && echo "✅ $CI_COMMIT_REF_NAME" || echo "⚠️ Non-standard: $CI_COMMIT_REF_NAME"
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
  allow_failure: true

validate:commit-message:
  stage: validate
  image: alpine:3.21
  script:
    - |
      MSG=$(echo "$CI_COMMIT_MESSAGE" | head -1)
      echo "$MSG" | grep -qE "^Merge " && exit 0
      echo "$MSG" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: " && echo "✅ $MSG" || echo "⚠️ $MSG"
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
  allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# Test & Security
# ─────────────────────────────────────────────────────────────────────────────

lint:
  extends: .go-base
  stage: test
  script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
    - sh scripts/ci-lint.sh
  artifacts:
    when: always
    paths: [.artifacts/lint]
    expire_in: 30 days
  rules: *rules-code-changes
  allow_failure: false

test:go:
  extends: .go-base
  stage: test
  script:
    - apk add --no-cache gcc musl-dev
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths: [coverage.out]
    expire_in: 7 days
  rules: *rules-code-changes

security:trivy:
  stage: security
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    # Block on CRITICAL/HIGH Go dependency vulnerabilities
    - trivy fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore --format table .
    # Warn on MEDIUM/LOW (track, don't block)
    - trivy fs --exit-code 0 --severity MEDIUM,LOW --ignorefile .trivyignore --format table .
  rules: *rules-code-changes
  allow_failure: false

security:govulncheck:
  extends: .go-base
  stage: security
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - ./scripts/govulncheck-gate.sh
  artifacts:
    when: always
    paths: [.artifacts/govulncheck]
    expire_in: 30 days
  rules: *rules-code-changes
  allow_failure: false

security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --no-git
  rules: *rules-code-changes
  allow_failure: false # Block on secrets detection

test:release:
  stage: test
  image: python:3.12-alpine
  script:
    - python3 -m unittest discover -s scripts -p test_release.py -v
  rules: *rules-docker

# ─────────────────────────────────────────────────────────────────────────────
# Build
# ─────────────────────────────────────────────────────────────────────────────

build:go:
  extends: .go-base
  stage: build
  script:
    - apk add --no-cache ca-certificates tzdata
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o $BINARY_NAME ./cmd/dnsweaver
  artifacts:
    paths: [$BINARY_NAME]
    expire_in: 1 day
  rules: *rules-code-changes

# ─────────────────────────────────────────────────────────────────────────────
# Pages (Documentation Preview)
# ─────────────────────────────────────────────────────────────────────────────

.pages-base:
  stage: pages
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git cairo-dev libffi-dev build-base
    - pip install mkdocs-material mkdocs-git-revision-date-localized-plugin pillow cairosvg

# Feature branch doc preview - accessible at $CI_PAGES_URL/-/jobs/$CI_JOB_ID/artifacts/public/
pages:preview:
  extends: .pages-base
  script:
    - mkdocs build --site-dir public
  artifacts:
    paths: [public]
    expire_in: 7 days
  environment:
    name: docs/preview/$CI_COMMIT_REF_SLUG
    url: $CI_JOB_URL/artifacts/public/index.html
    auto_stop_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|fix)\//
      changes: ["{docs/**/*,mkdocs.yml,README.md}"]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["{docs/**/*,mkdocs.yml,README.md}"]

# Main GitLab Pages deployment.
pages:
  extends: .pages-base
  script:
    - mkdocs build --site-dir public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: ["{docs/**/*,mkdocs.yml,README.md}"]

# ─────────────────────────────────────────────────────────────────────────────
# Docker (multi-arch)
# ─────────────────────────────────────────────────────────────────────────────

.docker-base:
  image: docker:29.8.1-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker-auth"
    REGISTRY_AUTH_FILE: "$CI_PROJECT_DIR/.docker-auth/config.json"
  before_script:
    - apk add --no-cache python3 skopeo git
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.docker-auth"
  rules: *rules-docker

docker:build:amd64:
  extends: .docker-base
  stage: docker
  script:
    - python3 scripts/release.py build --arch amd64
  artifacts:
    paths: [release/amd64]
    expire_in: 30 days
  tags: [docker]

docker:build:arm64:
  extends: .docker-base
  stage: docker
  script:
    - python3 scripts/release.py build --arch arm64
  artifacts:
    paths: [release/arm64]
    expire_in: 30 days
  tags: [arm64]

.container-scan:
  stage: qualify
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  before_script:
    - apk add --no-cache python3
  artifacts:
    when: always
    paths: [release]
    expire_in: 30 days
  rules: *rules-docker

security:container:amd64:
  extends: .container-scan
  needs: [docker:build:amd64]
  script:
    - python3 scripts/release.py scan --arch amd64

security:container:arm64:
  extends: .container-scan
  needs: [docker:build:arm64]
  script:
    - python3 scripts/release.py scan --arch arm64

release:assemble:
  extends: .docker-base
  stage: assemble
  needs: [security:container:amd64, security:container:arm64]
  script:
    - python3 scripts/release.py assemble
  artifacts:
    paths: [release]
    expire_in: 30 days
  tags: [docker]

# Public promotion is manual and serialized. No public job rebuilds an image.
# Existing public tags must resolve to the qualified commit before any write.
github:release:
  extends: .docker-base
  stage: release
  needs: [release:assemble]
  resource_group: public-release
  variables:
    RELEASE_PUBLISH: "yes"
  script:
    - printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
    - python3 scripts/release.py publish
  artifacts:
    when: always
    paths: [release/publication.json]
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/
      when: manual
      allow_failure: false
  tags: [docker]

# Sync the Docker Hub repository "Overview" (full_description) from docker/DOCKERHUB.md.
# Manual description sync after review of the public copy.
# Reuses the existing $DOCKERHUB_USERNAME / $DOCKERHUB_TOKEN CI variables.
github:dockerhub-description:
  stage: release
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      JWT=$(curl -s -H "Content-Type: application/json" -X POST \
        -d "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}')" \
        https://hub.docker.com/v2/users/login/ | jq -r .token)
      if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then echo "Docker Hub login failed"; exit 1; fi
      CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X PATCH \
        -H "Authorization: JWT $JWT" -H "Content-Type: application/json" \
        --data "$(jq -n --rawfile d docker/DOCKERHUB.md --rawfile s docker/DOCKERHUB-SHORT.txt \
          '{full_description:$d, description:($s|rtrimstr("\n"))}')" \
        "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/dnsweaver/")
      echo "Docker Hub PATCH HTTP $CODE"
      [ "$CODE" = "200" ] || { cat /tmp/resp.json; exit 1; }
      echo "Synced full_description ($(wc -c < docker/DOCKERHUB.md) bytes) + description ($(tr -d '\n' < docker/DOCKERHUB-SHORT.txt | wc -c) chars)"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["docker/DOCKERHUB.md", "docker/DOCKERHUB-SHORT.txt"]
      when: manual
      allow_failure: true
  tags: [docker]
