# DNSWeaver Configuration File Example
#
# This file demonstrates the full YAML configuration format.
# All settings shown with their default values unless marked otherwise.
#
# Configuration priority (highest to lowest):
#   1. Environment variables (DNSWEAVER_* prefix)
#   2. This config file
#   3. Default values
#
# Environment variable interpolation: Use ${VAR} or ${VAR:-default}
# Example: token: ${TECHNITIUM_TOKEN}
#
# ═══════════════════════════════════════════════════════════════════════════════
# SECRETS MANAGEMENT (v0.5.1+)
# ═══════════════════════════════════════════════════════════════════════════════
#
# For sensitive values like API tokens, you have three options:
#
# 1. Inline in YAML (simple, but exposes secrets in config file):
#    config:
#      token: my-secret-token
#
# 2. Environment variable interpolation (requires env var at load time):
#    config:
#      token: ${TECHNITIUM_TOKEN}
#
# 3. Provider-specific env var override (recommended for Docker/K8s secrets):
#    Leave token out of YAML entirely. Set env var at runtime:
#      DNSWEAVER_{PROVIDER_NAME}_TOKEN=secret-value
#    Or use _FILE suffix to read from a file (Docker secrets pattern):
#      DNSWEAVER_{PROVIDER_NAME}_TOKEN_FILE=/run/secrets/dns_token
#
#    Provider name is normalized: uppercase, hyphens become underscores.
#    Example: provider "my-dns" → DNSWEAVER_MY_DNS_TOKEN
#
# Secret fields supporting _FILE suffix:
#   TOKEN, API_KEY, AUTH_TOKEN, PASSWORD, TSIG_SECRET, SSH_PASSWORD
#
# Non-secret fields (env var override only, no _FILE):
#   URL, ZONE, ZONE_ID, API_EMAIL, TARGET, TTL, MODE, ADOPT_EXISTING,
#   ADOPT_EXISTING_ALLOW_OVERRIDES
# ═══════════════════════════════════════════════════════════════════════════════

# Logging configuration
logging:
  level: info        # debug, info, warn, error
  format: json       # json or text

# Reconciler settings
reconciler:
  interval: 60s           # How often to reconcile DNS records (Go duration)
  dry_run: false          # If true, log changes but don't apply them
  cleanup_orphans: true   # Delete records for removed containers
  cleanup_on_stop: true   # Delete records when containers stop (not just remove)
  ownership_tracking: true # Use TXT records to track record ownership
  adopt_existing: false   # Adopt pre-existing DNS records by creating TXT records

# Multi-instance coordination
# Unique identifier for this dnsweaver instance (for shared zone management)
# instance_id: ""          # e.g., "node-1", "k8s-prod" (1-63 chars, alphanumeric/hyphens/dots)

# Docker connection settings
docker:
  host: unix:///var/run/docker.sock  # Docker socket or TCP URL
  mode: auto                          # auto, swarm, or standalone

# Platform selection
# "docker" (default) — Docker/Swarm only
# "kubernetes" — Kubernetes only
# "both" — Docker and Kubernetes simultaneously
platform: docker

# Kubernetes settings (only used when platform is "kubernetes" or "both")
kubernetes:
  # kubeconfig: ""            # Path to kubeconfig; empty = in-cluster
  # namespaces: ""            # Comma-separated namespace filter; empty = all
  watch_ingress: true         # networking.k8s.io/v1 Ingress resources
  watch_ingressroute: true    # traefik.io/v1alpha1 IngressRoute CRDs
  watch_httproute: true       # gateway.networking.k8s.io/v1 HTTPRoute CRDs
  watch_services: false       # v1 Service resources (opt-in, can be noisy)
  # label_selector: ""        # Label selector for filtering (e.g. "app=myapp")
  # annotation_filter: ""     # Annotation key=value filter

# Health and metrics server
server:
  port: 8080  # Port for /health, /ready, and /metrics endpoints

# Hostname sources
# Order matters: first source with matching hostname wins
sources:
  # Traefik source with optional file-based discovery
  - name: traefik
    file_discovery:
      paths:
        - /config/traefik/dynamic
      pattern: "*.yml"
      poll_interval: 60s
      watch_method: auto  # auto, inotify, or poll

  # Native dnsweaver labels (no additional config needed)
  - name: dnsweaver

# DNS providers
# Order matters: first matching provider handles the hostname
providers:
  # Internal DNS using Technitium
  - name: internal
    type: technitium
    domains:
      - "*.internal.example.com"
      - "*.home.example.com"
    record_type: A        # A, AAAA, or CNAME
    target: 192.0.2.100    # Where to point DNS records (your load balancer/gateway IP)
    ttl: 300              # TTL in seconds
    mode: managed         # managed, authoritative, or additive
    adopt_existing: false # Override the global adoption policy for this provider
    adopt_existing_allow_overrides: false # Allow workload labels to enable adoption
    config:
      url: http://dns.example.com:5380
      token: ${TECHNITIUM_TOKEN}        # env var interpolation
      zone: internal.example.com
      # auto_https_records: true          # Companion HTTPS records (enabled by default)
      # auto_https_alpn: h2               # ALPN protocol for companion records

  # Public DNS using Cloudflare
  - name: public
    type: cloudflare
    domains:
      - "*.example.com"
    exclude_domains:
      - "*.internal.example.com"    # Don't manage internal subdomains
      - "*.home.example.com"
    record_type: CNAME
    target: lb.example.com          # CNAME target
    ttl: 300
    config:
      api_token: ${CLOUDFLARE_TOKEN}
      zone_id: ${CLOUDFLARE_ZONE_ID}
      proxied: "false"              # Cloudflare proxy status

  # Pi-hole example
  - name: pihole
    type: pihole
    domains:
      - "*.local.example.com"
    record_type: A
    target: 192.168.1.100
    config:
      url: http://pihole.example.com
      access_mode: api        # api (default) or file
      token: ${PIHOLE_TOKEN}

  # Webhook provider for custom integrations
  - name: custom
    type: webhook
    domains:
      - "*.custom.example.com"
    record_type: A
    target: 192.0.2.50
    config:
      url: https://webhook.example.com/dns
      auth_header: X-API-Key
      auth_token: ${WEBHOOK_TOKEN}
      timeout: 30s
      retries: "3"
      retry_delay: 5s

  # RFC 2136 Dynamic DNS example
  # - name: bind-dns
  #   type: rfc2136
  #   domains:
  #     - "*.rfc.example.com"
  #   record_type: A
  #   target: 192.0.2.100
  #   ttl: 300
  #   config:
  #     server: ns1.example.com:53
  #     zone: rfc.example.com.
  #     tsig_key_name: dnsweaver.
  #     tsig_secret: ${TSIG_SECRET}
  #     tsig_algorithm: hmac-sha256

  # dnsmasq provider example (file-based DNS)
  # - name: dnsmasq
  #   type: dnsmasq
  #   domains:
  #     - "*.lan.example.com"
  #   record_type: A
  #   target: 192.168.1.1
  #   config:
  #     config_dir: /etc/dnsmasq.d
  #     config_file: dnsweaver.conf
  #     reload_command: systemctl reload dnsmasq
  #     zone: lan.example.com

